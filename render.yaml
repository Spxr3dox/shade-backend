# Render разворачивает по этому файлу и веб-сервис, и базу разом.
# ADMIN_TOKEN генерируется Render'ом сам (generateValue) — в код он не попадает.
services:
  - type: web
    name: shade-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shade-db
          property: connectionString

databases:
  - name: shade-db
    plan: free
